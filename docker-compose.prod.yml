services:
  chatbot:
    image: ghcr.io/hansung-sudo/chatbot-team6:latest
    container_name: chatbot
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DB_PATH: /data/chatbot.db
    volumes:
      - chatbot-data:/data
    pull_policy: always

volumes:
  chatbot-data:
